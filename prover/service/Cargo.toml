[package]
name = "swarm-prover"
version = "0.1.0"
edition = "2021"
default-run = "swarm-prover"
description = "Off-chain side of ZK settlement: message collector, prover, settler, and a node simulator"

[[bin]]
name = "swarm-prover"
path = "src/main.rs"

[[bin]]
name = "node-sim"
path = "src/bin/node_sim.rs"

[dependencies]
swarm-vm = { workspace = true }
alloy-sol-types = { workspace = true }
serde = { workspace = true }
sp1-sdk = { version = "6.0.1", features = ["blocking", "native-gnark"] }
alloy = { version = "2", features = ["full"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenv = "0.15"
rand = "0.8"
hex = "0.4"

[build-dependencies]
sp1-build = "6.0.1"
